[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # eel 本体が古い pyparsing の書き方を使っているため、eel 由来の非推奨警告だけ無視します。
    "ignore::DeprecationWarning:eel",
]
